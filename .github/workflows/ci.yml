name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the test tools use Node's built-in WebSocket; playing / hosting needs only Node 18+
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build and check that the committed bundle matches the source
        run: |
          npm run build
          git diff --exit-code -- dist/game.js || (echo "dist/game.js is out of date: run npm run build and commit it" && exit 1)

      - name: LAN server protocol checks
        run: npm run servertest

      - name: Single-player suite
        run: npm test

      - name: Multiplayer (real server, several browser contexts)
        run: npm run mptest

      - name: Smoke test (real menu flow)
        run: npm run smoke

      # The full end-to-end matrix (28 missions) takes about an hour; CI plays one mission end to end.
      - name: End-to-end sample
        run: node tools/e2e.cjs warehouse/rescue/quick --seeds 7
