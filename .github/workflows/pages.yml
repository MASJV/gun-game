name: Solo demo (GitHub Pages)

# Publishes the static game (index.html + dist/) so it can be played solo in a browser.
# LAN co-op is not available from this page: it needs a host running `npm run lan` on the local network.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static game
        run: |
          mkdir -p _site/dist
          cp index.html _site/
          cp dist/game.js dist/assets.js _site/dist/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
