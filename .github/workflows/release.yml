name: Release

# Pushing a tag such as v2.4.1, or running this workflow by hand on main (Actions → Release → Run workflow), publishes
# a GitHub Release with a ready-to-run ZIP. A manual run tags the commit it runs on with v<package.json version>.
# The ZIP holds the solo game (index.html + dist/) and the LAN host (server/ + package.json), plus the docs it needs.
# No node_modules, sources or test artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag and check it matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "run the release by hand from main only (this run is on $GITHUB_REF_NAME)"; exit 1; }
            tag="v$v"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "tag $tag already exists"; exit 1; fi
          else
            tag="$GITHUB_REF_NAME"
            [ "v$v" = "$tag" ] || { echo "tag $tag does not match package.json version $v"; exit 1; }
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build the ZIP
        run: |
          d="shadow-protocol-$TAG"
          mkdir -p "$d/dist" "$d/server" "$d/docs/media"
          cp index.html LICENSE package.json README.md RELEASE_NOTES.md CLAUDE.md GAME_PLAN.md "$d/"
          cp dist/game.js dist/assets.js "$d/dist/"
          cp server/lan.cjs "$d/server/"
          cp docs/*.md "$d/docs/"
          cp docs/media/gameplay-solo.png docs/media/gameplay-coop.png "$d/docs/media/"
          node tools/check-links.cjs "$d"
          printf 'SHADOW PROTOCOL %s\n\nSolo: open index.html in Chrome, Edge or Firefox.\nLAN co-op: with Node 18+, run  node server/lan.cjs  (or npm run lan) in this folder and open the address it prints.\nSee README.md and docs/MULTIPLAYER.md.\n' "$TAG" > "$d/PLAY.txt"
          zip -r "$d.zip" "$d"
          unzip -l "$d.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk "/^## $TAG/{f=1;next} /^## /{f=0} f" RELEASE_NOTES.md)"
          gh release create "$TAG" "shadow-protocol-$TAG.zip" --target "$GITHUB_SHA" --title "SHADOW PROTOCOL $TAG" --notes "$notes"
